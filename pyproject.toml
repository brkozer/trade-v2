[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradev2"
version = "0.1.0"
description = "Cost-aware quantitative alpha research and simulated execution"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "numpy>=2.1,<2.3", "httpx>=0.28,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=14,<17",
  "portalocker>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "hypothesis>=6,<7"]

[project.scripts]
tradev2 = "tradev2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
